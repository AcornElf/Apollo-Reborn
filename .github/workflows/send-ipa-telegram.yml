name: Send IPA to Telegram

on:
  workflow_run:
    workflows:
      - Build IPA
    types:
      - completed

  workflow_dispatch:

env:
  RELEASE_TAG: latest-build
  PAGES_URL: https://acornelf.github.io/Apollo-Reborn/

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Determine Build IPA run
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_ID=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPOSITORY/actions/workflows/build-ipa.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id')

            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "No successful Build IPA workflow run found."
              exit 1
            fi

            COMMIT_SHA=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPOSITORY/actions/runs/$RUN_ID" \
              --jq '.head_sha')

            echo "Using latest successful Build IPA run: $RUN_ID"
          else
            RUN_ID="${{ github.event.workflow_run.id }}"
            COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"

            echo "Using completed Build IPA run: $RUN_ID"
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Find IPA artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ARTIFACT=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | endswith(".ipa")) | .id' \
            | head -n 1)

          if [ -z "$ARTIFACT" ]; then
            echo "No IPA artifact found."
            exit 1
          fi

          echo "Found IPA artifact: $ARTIFACT"
          echo "artifact_id=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Download IPA artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          mkdir -p artifact

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > artifact.zip

          unzip -q artifact.zip -d artifact

          IPA_FILE=$(find artifact -type f -name "*.ipa" -print -quit)

          if [ -z "$IPA_FILE" ]; then
            echo "No IPA file found inside the artifact."
            exit 1
          fi

          echo "Found IPA: $IPA_FILE"
          cp "$IPA_FILE" Apollo-Reborn.ipa

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          COMMIT_SHA: ${{ steps.run.outputs.commit_sha }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Latest build release already exists."
          else
            echo "Creating latest build release."

            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --target "$COMMIT_SHA" \
              --title "Latest build" \
              --notes "Automatically updated latest build of Apollo Reborn." \
              --latest=false
          fi

          echo "Uploading latest IPA..."

          gh release upload "$RELEASE_TAG" \
            Apollo-Reborn.ipa \
            --repo "$REPOSITORY" \
            --clobber

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Create SideStore redirect page
        env:
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/Apollo-Reborn.ipa
        run: |
          ENCODED_RELEASE_URL=$(python3 -c 'import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$RELEASE_URL")

          SIDESTORE_URL="sidestore://install?url=$ENCODED_RELEASE_URL"

          mkdir -p pages

          cat > pages/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0;url=$SIDESTORE_URL">
            <title>Install Apollo Reborn</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                text-align: center;
                padding: 3rem 1.5rem;
              }

              a {
                display: inline-block;
                padding: 0.8rem 1.2rem;
                border-radius: 0.7rem;
                background: #007aff;
                color: white;
                text-decoration: none;
              }
            </style>
          </head>
          <body>
            <h1>Apollo Reborn</h1>
            <p>Opening SideStore…</p>
            <p>
              <a href="$SIDESTORE_URL">Install in SideStore</a>
            </p>

            <script>
              window.location.replace("$SIDESTORE_URL");
            </script>
          </body>
          </html>
          EOF

          echo "Generated SideStore redirect page."
          echo "IPA URL: $RELEASE_URL"
          echo "SideStore URL: $SIDESTORE_URL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.run.outputs.commit_sha }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          PAGES_URL: ${{ env.PAGES_URL }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"

          RELEASE_URL="https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/Apollo-Reborn.ipa"

          MESSAGE="📦 <b>Apollo Reborn IPA ready</b>

          <b>Commit</b> <code>$SHORT_SHA</code>

          <a href=\"$PAGES_URL\">Install in SideStore</a>

          <a href=\"$RELEASE_URL\">Download IPA</a>"

          curl -sS -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MESSAGE"
