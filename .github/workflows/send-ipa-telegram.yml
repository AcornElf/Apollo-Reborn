name: Send IPA to Telegram

on:
  workflow_run:
    workflows:
      - Build IPA
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Set artifact URL
        id: artifact
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=https://github.com/AcornElf/Apollo-Reborn/actions/runs/34152846381/artifacts/10030073390" >> "$GITHUB_OUTPUT"
          else
            ARTIFACT=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name | endswith(".ipa")) | .id' \
              | head -n 1)

            if [ -z "$ARTIFACT" ]; then
              echo "No IPA artifact found."
              exit 1
            fi

            echo "url=https://github.com/$REPOSITORY/actions/runs/$RUN_ID/artifacts/$ARTIFACT" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.url }}
        run: |
          MESSAGE="📦 <b>Apollo Reborn IPA ready</b>

          <a href=\"$ARTIFACT_URL\">Download IPA</a>"

          curl -sS -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MESSAGE"
