name: Send IPA to Telegram

on:
  workflow_run:
    workflows:
      - Build IPA
    types:
      - completed

  workflow_dispatch:

env:
  PAGES_URL: https://acornelf.github.io/Apollo-Reborn

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Determine Build IPA run
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_ID=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPOSITORY/actions/workflows/build-ipa.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id')

            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "No successful Build IPA workflow run found."
              exit 1
            fi

            COMMIT_SHA=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPOSITORY/actions/runs/$RUN_ID" \
              --jq '.head_sha')

            echo "Using latest successful Build IPA workflow run: $RUN_ID"
          else
            RUN_ID="${{ github.event.workflow_run.id }}"
            COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"

            echo "Using completed Build IPA workflow run: $RUN_ID"
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"
          RELEASE_TAG="build-$SHORT_SHA"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$(gh api -H "Accept: application/vnd.github+json" "/repos/$REPOSITORY/actions/runs/$RUN_ID" --jq '.head_branch')" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Find IPA artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ARTIFACT=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | endswith(".ipa")) | .id' \
            | head -n 1)

          if [ -z "$ARTIFACT" ]; then
            echo "No IPA artifact found."
            exit 1
          fi

          echo "Found IPA artifact: $ARTIFACT"
          echo "artifact_id=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Download IPA artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          mkdir -p artifact

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > artifact.zip

          unzip -q artifact.zip -d artifact

          IPA_FILE=$(find artifact -type f -name "*.ipa" -print -quit)

          if [ -z "$IPA_FILE" ]; then
            echo "No IPA file found inside the artifact."
            exit 1
          fi

          echo "Found IPA: $IPA_FILE"
          cp "$IPA_FILE" com.christianselig.Apollo.ipa

      - name: Create or update build release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.run.outputs.release_tag }}
          SHORT_SHA: ${{ steps.run.outputs.short_sha }}
          COMMIT_SHA: ${{ steps.run.outputs.commit_sha }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            echo "Creating release $RELEASE_TAG."

            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --target "$COMMIT_SHA" \
              --title "Apollo Reborn $SHORT_SHA" \
              --notes "Apollo Reborn build for commit $COMMIT_SHA." \
              --latest=false
          fi

          echo "Removing existing IPA asset if present..."

          gh release delete-asset "$RELEASE_TAG" \
            "com.christianselig.Apollo.ipa" \
            --repo "$REPOSITORY" \
            --yes || true

          echo "Uploading IPA..."

          gh release upload "$RELEASE_TAG" \
            com.christianselig.Apollo.ipa \
            --repo "$REPOSITORY"

      - name: Keep only the five newest builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "Finding old build releases..."

          OLD_RELEASES=$(gh release list \
            --repo "$REPOSITORY" \
            --limit 100 \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName')

          if [ -z "$OLD_RELEASES" ]; then
            echo "No old releases to remove."
          else
            while IFS= read -r TAG; do
              if [ -n "$TAG" ]; then
                echo "Deleting old release: $TAG"

                gh release delete "$TAG" \
                  --repo "$REPOSITORY" \
                  --yes \
                  --cleanup-tag
              fi
            done <<< "$OLD_RELEASES"
          fi

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Create Pages for retained builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PAGES_URL: ${{ env.PAGES_URL }}
        run: |
          rm -rf pages
          mkdir -p pages

          RELEASE_TAGS=$(gh release list \
            --repo "$REPOSITORY" \
            --limit 100 \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[0:5] | .[].tagName')

          if [ -z "$RELEASE_TAGS" ]; then
            echo "No build releases found."
            exit 1
          fi

          LATEST_TAG=$(echo "$RELEASE_TAGS" | head -n 1)

          while IFS= read -r TAG; do
            if [ -z "$TAG" ]; then
              continue
            fi

            SHORT_SHA="${TAG#build-}"

            RELEASE_URL="https://github.com/$REPOSITORY/releases/download/$TAG/com.christianselig.Apollo.ipa"

            ENCODED_RELEASE_URL=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$RELEASE_URL")

            SIDESTORE_URL="sidestore://install?url=$ENCODED_RELEASE_URL"

            mkdir -p "pages/$TAG"

            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html lang="en">' \
              '<head>' \
              '<meta charset="utf-8">' \
              '<meta name="viewport" content="width=device-width, initial-scale=1">' \
              '<meta http-equiv="refresh" content="0;url='"$SIDESTORE_URL"'">' \
              '<title>Install Apollo Reborn '"$SHORT_SHA"'</title>' \
              '<style>' \
              'body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 3rem 1.5rem; }' \
              'a.install { display: inline-block; padding: 0.8rem 1.2rem; margin: 0.4rem; border-radius: 0.7rem; background: #007aff; color: white; text-decoration: none; }' \
              'a.download { color: #000; text-decoration: underline; display: inline-block; margin-top: 0.8rem; }' \
              '</style>' \
              '</head>' \
              '<body>' \
              '<h1>Apollo Reborn</h1>' \
              '<p>Build <code>'"$SHORT_SHA"'</code></p>' \
              '<p>Opening SideStore…</p>' \
              '<p><a class="install" href="'"$SIDESTORE_URL"'">Install in SideStore</a></p>' \
              '<p><a class="download" href="'"$RELEASE_URL"'">Download IPA</a></p>' \
              '<script>window.location.replace("'"$SIDESTORE_URL"'");</script>' \
              '</body>' \
              '</html>' \
              > "pages/$TAG/index.html"

            echo "Created Pages entry for $TAG"
          done <<< "$RELEASE_TAGS"

          LATEST_RELEASE_URL="https://github.com/$REPOSITORY/releases/download/$LATEST_TAG/com.christianselig.Apollo.ipa"

          ENCODED_LATEST_RELEASE_URL=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$LATEST_RELEASE_URL")

          LATEST_SIDESTORE_URL="sidestore://install?url=$ENCODED_LATEST_RELEASE_URL"
          LATEST_SHORT_SHA="${LATEST_TAG#build-}"

          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html lang="en">' \
            '<head>' \
            '<meta charset="utf-8">' \
            '<meta name="viewport" content="width=device-width, initial-scale=1">' \
            '<meta http-equiv="refresh" content="0;url='"$LATEST_SIDESTORE_URL"'">' \
            '<title>Install Apollo Reborn</title>' \
            '<style>' \
            'body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 3rem 1.5rem; }' \
            'a.install { display: inline-block; padding: 0.8rem 1.2rem; margin: 0.4rem; border-radius: 0.7rem; background: #007aff; color: white; text-decoration: none; }' \
            'a.download { color: #000; text-decoration: underline; display: inline-block; margin-top: 0.8rem; }' \
            '</style>' \
            '</head>' \
            '<body>' \
            '<h1>Apollo Reborn</h1>' \
            '<p>Build <code>'"$LATEST_SHORT_SHA"'</code></p>' \
            '<p>Opening SideStore…</p>' \
            '<p><a class="install" href="'"$LATEST_SIDESTORE_URL"'">Install in SideStore</a></p>' \
            '<p><a class="download" href="'"$LATEST_RELEASE_URL"'">Download IPA</a></p>' \
            '<script>window.location.replace("'"$LATEST_SIDESTORE_URL"'");</script>' \
            '</body>' \
            '</html>' \
            > pages/index.html

          echo "Created root Pages entry for $LATEST_TAG."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.run.outputs.commit_sha }}
          SHORT_SHA: ${{ steps.run.outputs.short_sha }}
          BRANCH: ${{ steps.run.outputs.branch }}
          RELEASE_TAG: ${{ steps.run.outputs.release_tag }}
          PAGES_URL: ${{ env.PAGES_URL }}
        run: |
          RELEASE_URL="https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/com.christianselig.Apollo.ipa"
          INSTALL_URL="$PAGES_URL/$RELEASE_TAG/"

          MESSAGE="📦 <b>Apollo Reborn IPA ready</b>

          <b>Commit</b> <code>$SHORT_SHA</code>
          <b>Branch</b> <code>$BRANCH</code>

          <a href=\"$INSTALL_URL\">Install in SideStore</a>

          <a href=\"$RELEASE_URL\">Download IPA</a>"

          curl -sS -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MESSAGE"
