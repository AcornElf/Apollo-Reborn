name: Send IPA to Telegram

on:
  workflow_run:
    workflows:
      - Build IPA
    types:
      - completed

env:
  RELEASE_TAG: latest-build

permissions:
  actions: read
  contents: write

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Find IPA artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ARTIFACT=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | endswith(".ipa")) | .id' \
            | head -n 1)

          if [ -z "$ARTIFACT" ]; then
            echo "No IPA artifact found."
            exit 1
          fi

          echo "Found IPA artifact: $ARTIFACT"
          echo "artifact_id=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Download IPA artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          mkdir -p artifact

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > artifact.zip

          unzip -q artifact.zip -d artifact

          IPA_FILE=$(find artifact -type f -name "*.ipa" -print -quit)

          if [ -z "$IPA_FILE" ]; then
            echo "No IPA file found inside the artifact."
            exit 1
          fi

          echo "Found IPA: $IPA_FILE"
          cp "$IPA_FILE" Apollo-Reborn.ipa

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Latest build release already exists."
          else
            echo "Creating latest build release."
            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --target "$COMMIT_SHA" \
              --title "Latest build" \
              --notes "Automatically updated latest build of Apollo Reborn." \
              --latest=false
          fi

          echo "Uploading latest IPA..."
          gh release upload "$RELEASE_TAG" \
            Apollo-Reborn.ipa \
            --repo "$REPOSITORY" \
            --clobber

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"

          RELEASE_URL="https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/Apollo-Reborn.ipa"

          ENCODED_RELEASE_URL=$(python3 -c 'import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$RELEASE_URL")

          SIDESTORE_URL="sidestore://install?url=$ENCODED_RELEASE_URL"

          MESSAGE="📦 <b>Apollo Reborn IPA ready</b>

          <b>Commit</b> <code>$SHORT_SHA</code>

          <a href=\"$SIDESTORE_URL\">Install in SideStore</a>

          <a href=\"$RELEASE_URL\">Download IPA</a>"

          curl -sS -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MESSAGE"
