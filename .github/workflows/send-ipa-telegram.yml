name: Send IPA to Telegram

on:
  workflow_run:
    workflows:
      - Build IPA
    types:
      - completed

env:
  RELEASE_TAG: build-${{ github.run_number }}

permissions:
  actions: read
  contents: write

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Find IPA artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ARTIFACT=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | endswith(".ipa")) | .id' \
            | head -n 1)

          if [ -z "$ARTIFACT" ]; then
            echo "No IPA artifact found."
            exit 1
          fi

          echo "artifact_id=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Download IPA artifact
        uses: actions/download-artifact@v3
        with:
        name: ipa
        path: ipa

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Latest build
        draft: false
        files: ipa/Apollo-Reborn.ipa
        env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          RELEASE_URL="https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/Apollo-Reborn.ipa"
          SIDESTORE_URL="sidestore://install?url=$RELEASE_URL"

          MESSAGE="📦 <b>Apollo Reborn IPA ready</b>

          <b>Commit</b> <code>$SHORT_SHA</code>

          <a href=\"$SIDESTORE_URL\">Install IPA</a>"

          curl -sS -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MESSAGE"
